services:
  lantern:
    build: .
    container_name: lantern
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    volumes:
      - ./config.json:/app/config.json:ro
      - lantern-data:/data
    command: ["--config", "/app/config.json", "--database", "/data/lantern.db", "--host", "0.0.0.0"]
    environment:
      LANTERN_INGEST_TOKEN: ${LANTERN_INGEST_TOKEN:-}
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)"]
      interval: 30s
      timeout: 4s
      start_period: 15s
      retries: 3

  demo-web:
    profiles: ["demo"]
    build: .
    container_name: lantern-demo-web
    restart: unless-stopped
    init: true
    entrypoint: ["python", "-m", "lantern.demo_server"]
    command: ["--host", "0.0.0.0", "--port", "8000", "--server-name", "demo-web", "--collector", "http://lantern:8080"]
    environment:
      LANTERN_INGEST_TOKEN: ${LANTERN_INGEST_TOKEN:-}
    depends_on:
      - lantern
    ports:
      - "127.0.0.1:8001:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64

volumes:
  lantern-data:
